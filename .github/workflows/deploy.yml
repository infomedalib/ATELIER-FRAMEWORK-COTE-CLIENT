name: Deploy ticket apps to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'TP2_Tickets_Maintenance/**'
      - 'TP2_Tickets_Maintenance_part2/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            TP2_Tickets_Maintenance/package-lock.json
            TP2_Tickets_Maintenance_part2/package-lock.json

      - name: Install and build main TP2 app
        working-directory: TP2_Tickets_Maintenance
        run: |
          npm ci
          npm run build

      - name: Install and build TP2 part 2 app
        working-directory: TP2_Tickets_Maintenance_part2
        run: |
          npm ci
          npm run build

      - name: Prepare Pages site
        run: |
          mkdir -p site/TP2_Tickets_Maintenance site/tp2-tickets-maintenance-dali
          cp TP2_Tickets_Maintenance/dist/index.html TP2_Tickets_Maintenance/dist/404.html
          cp -a TP2_Tickets_Maintenance/dist/. site/TP2_Tickets_Maintenance/
          cp TP2_Tickets_Maintenance_part2/dist/index.html TP2_Tickets_Maintenance_part2/dist/404.html
          cp -a TP2_Tickets_Maintenance_part2/dist/. site/tp2-tickets-maintenance-dali/
          cat > site/404.html <<'EOF'
          <!doctype html>
          <html lang="en">
            <head><meta charset="utf-8"><title>Loading app</title></head>
            <body>
              <p>Loading application…</p>
              <script>
                const prefixes = [
                  '/ATELIER-FRAMEWORK-COTE-CLIENT/TP2_Tickets_Maintenance/',
                  '/ATELIER-FRAMEWORK-COTE-CLIENT/tp2-tickets-maintenance-dali/'
                ];
                const prefix = prefixes.find((candidate) => location.pathname.startsWith(candidate));
                if (prefix) {
                  fetch(prefix + 'index.html')
                    .then((response) => {
                      if (!response.ok) throw new Error('HTTP ' + response.status);
                      return response.text();
                    })
                    .then((html) => {
                      document.open();
                      document.write(html);
                      document.close();
                    })
                    .catch((error) => {
                      document.body.textContent = 'Unable to load application: ' + error.message;
                    });
                } else {
                  document.body.textContent = 'Application not found.';
                }
              </script>
            </body>
          </html>
          EOF

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

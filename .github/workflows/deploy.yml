name: Deploy Vue app to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'gestion-ordinateurs/**'
      - 'TP2_Tickets_Maintenance/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: gestion-ordinateurs/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: gestion-ordinateurs

      - name: Build Vue app
        run: npm run build
        working-directory: gestion-ordinateurs

      - name: Install tickets app dependencies
        run: npm ci
        working-directory: TP2_Tickets_Maintenance

      - name: Build tickets app
        run: npm run build
        working-directory: TP2_Tickets_Maintenance

      - name: Prepare Pages site
        run: |
          mkdir -p site/TP2_Tickets_Maintenance
          cp -a gestion-ordinateurs/dist/. site/
          cp -a TP2_Tickets_Maintenance/dist/. site/TP2_Tickets_Maintenance/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
